<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MontX | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg-primary,#0f172a);color:var(--text-primary,#f8fafc);font-family:'Inter',sans-serif}
    .auth-card{width:100%;max-width:410px;background:var(--bg-secondary,#1e293b);border:1px solid var(--border,#334155);border-radius:18px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative;z-index:2}
    .auth-brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px}
    .auth-brand-icon{width:40px;height:40px;border-radius:11px;background:var(--accent,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px}
    .auth-brand b{font-size:19px;display:block;line-height:1.1}
    .auth-brand small{font-size:10px;letter-spacing:1.2px;color:var(--text-muted,#94a3b8)}
    .auth-title{text-align:center;margin:0 0 6px;font-size:18px;font-weight:700}
    .auth-sub{text-align:center;margin:0 0 20px;font-size:12px;color:var(--text-muted,#94a3b8)}
    .role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
    .role-option{border:1px solid var(--border,#334155);background:var(--bg-primary,#0f172a);border-radius:11px;padding:10px 6px;text-align:center;cursor:pointer;transition:.15s;color:var(--text-secondary,#94a3b8)}
    .role-option i{display:block;font-size:18px;margin-bottom:5px}
    .role-option span{font-size:11px;font-weight:600;display:block;line-height:1.2}
    .role-option.active{border-color:var(--accent,#2563EB);background:rgba(37,99,235,.12);color:var(--accent,#2563EB)}
    .field{margin-bottom:13px}
    .field label{display:block;font-size:11px;font-weight:600;color:var(--text-secondary,#cbd5e1);margin-bottom:5px}
    .field input{width:100%;height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--border,#334155);background:var(--bg-primary,#0f172a);color:var(--text-primary,#fff);font-size:13px;box-sizing:border-box;outline:0}
    .field input:focus{border-color:var(--accent,#2563EB);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
    .auth-btn{width:100%;height:44px;border:0;border-radius:10px;background:var(--accent,#2563EB);color:#fff;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px}
    .auth-btn:hover{opacity:.93}
    .auth-msg{font-size:12px;margin-bottom:12px;padding:9px 11px;border-radius:9px;display:none}
    .auth-msg.err{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25)}
    .auth-foot{text-align:center;margin-top:16px;font-size:12px;color:var(--text-muted,#94a3b8)}
    .auth-foot a{color:var(--accent,#2563EB);font-weight:600;text-decoration:none}
    .theme-fab{position:fixed;top:16px;right:16px;z-index:5}
  </style>
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <button class="icon-btn theme-fab" id="themeToggle" type="button" aria-label="Toggle theme"><i class="bi bi-moon-stars"></i></button>

  <main class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-icon"><i class="bi bi-buildings"></i></span>
      <div><b>MontX</b><small>CONSTRUCTION MANAGEMENT</small></div>
    </div>

    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Select your role and sign in to continue</p>

    <div id="authMsg" class="auth-msg"></div>

    <form id="loginForm">
      <div class="field">
        <label>Select Role</label>
        <div class="role-grid" id="loginRoleGrid">
          <div class="role-option active" data-role="super_admin">
            <i class="bi bi-shield-lock"></i><span>Super Admin</span>
          </div>
          <div class="role-option" data-role="viewer">
            <i class="bi bi-eye"></i><span>Viewer</span>
          </div>
          <div class="role-option" data-role="site_manager">
            <i class="bi bi-person-badge"></i><span>Site Manager</span>
          </div>
        </div>
        <input type="hidden" id="loginRole" value="super_admin">
      </div>

      <div class="field">
        <label for="loginUser">Username</label>
        <input id="loginUser" type="text" required autocomplete="username" placeholder="Enter username">
      </div>

      <div class="field">
        <label for="loginPin">Password / PIN</label>
        <input id="loginPin" type="password" required autocomplete="current-password" placeholder="Enter password or PIN">
      </div>

      <button type="submit" class="auth-btn">Login to Workspace</button>
    </form>

    <div class="auth-foot">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
  <script>
  (() => {
    const AUTH_KEY = 'montx-auth-session-v1';
    const USERS_KEY = 'montx-users-v1';
    const DEFAULT_USERS = [
      { id: 'u-admin',   name: 'Super Admin',  username: 'admin',   pin: '1234', role: 'super_admin',  label: 'Super Admin' },
      { id: 'u-viewer',  name: 'Viewer',       username: 'viewer',  pin: '2222', role: 'viewer',       label: 'Viewer' },
      { id: 'u-manager', name: 'Site Manager', username: 'manager', pin: '3333', role: 'site_manager', label: 'Site Manager' }
    ];
    const ROLE_LABELS = { super_admin: 'Super Admin', viewer: 'Viewer', site_manager: 'Site Manager' };

    function getUsers() {
      try {
        const saved = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
        const list = Array.isArray(saved) ? saved : [];
        DEFAULT_USERS.forEach(def => {
          if (!list.some(u => String(u.username || '').toLowerCase() === def.username)) list.push(def);
        });
        return list;
      } catch {
        return [...DEFAULT_USERS];
      }
    }

    document.querySelectorAll('#loginRoleGrid .role-option').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('#loginRoleGrid .role-option').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        document.getElementById('loginRole').value = card.dataset.role;
      });
    });

    const msgBox = document.getElementById('authMsg');
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      msgBox.style.display = 'none';

      const role = document.getElementById('loginRole').value;
      const username = document.getElementById('loginUser').value.trim().toLowerCase();
      const pin = document.getElementById('loginPin').value.trim();

      const users = getUsers();
      let user = null;
      for (const u of users) {
        if (
          String(u.username || '').toLowerCase() === username &&
          u.role === role &&
          (await window.MontXVerifyPin(u.pin, pin))
        ) {
          user = u;
          break;
        }
      }

      if (!user) {
        msgBox.textContent = 'Invalid username, password, or selected role.';
        msgBox.className = 'auth-msg err';
        msgBox.style.display = 'block';
        return;
      }

      // Auto-upgrade old plain-text PIN to SHA-256 hash on login
      if (!String(user.pin || '').startsWith('sha256:')) {
        user.pin = await window.MontXHashPin(pin);
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
      }

      sessionStorage.setItem(AUTH_KEY, JSON.stringify({
        username: user.username,
        role: user.role,
        label: user.name || ROLE_LABELS[user.role] || user.role
      }));

      location.href = user.role === 'site_manager' ? 'attendance.html' : 'index.html';
    });
  })();
  </script>
</body>
</html>
